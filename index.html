<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>temp-vite</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- vConsole Debugger for Mobile Webview -->
    <script src="https://unpkg.com/vconsole@3.15.1/dist/vconsole.min.js"></script>
    <script>
      // Initialize vConsole
      window.vConsole = new window.VConsole();
      console.log("vConsole Initialized.");

      // Generic error listener
      window.addEventListener('error', function(event) {
        console.error("Global Error Caught:", event.message, "at", event.filename, ":", event.lineno);
      });
      window.addEventListener('unhandledrejection', function(event) {
        console.error("Unhandled Promise Rejection:", event.reason);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
